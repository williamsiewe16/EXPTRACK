services:
  # Telegram Bot Service
  - type: web
    name: expense-tracker-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python expense_tracker_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    
    # Health check (optional but recommended)
    healthCheckPath: /